[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oil-news-alert"
version = "0.1.0"
description = "AI oil-news alert system for European Brent traders (MVP)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",  # function calls in argument defaults — FastAPI uses Depends() this way
]

[tool.ruff.lint.per-file-ignores]
"app/db/alembic/versions/*" = ["E501"]  # generated migrations can be long

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
