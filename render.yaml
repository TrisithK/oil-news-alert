# Render blueprint — deploy the whole system from a connected GitHub repo.
# Render → New → Blueprint → pick this repo. See DEPLOY.md for the full walkthrough.
#
# Free-tier note: this blueprint is fully free — database, API, and frontend are all free-eligible.
# The always-on worker (continuous ingest→analyze→alert) needs a paid instance, so it is omitted
# here; ingestion is driven by a free external cron hitting POST /api/ingest/run (see DEPLOY.md).

databases:
  - name: oilnews-db
    plan: free
    postgresMajorVersion: "15"

services:
  # --- API (REST + SSE) -----------------------------------------------------
  - type: web
    name: oilnews-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    # Free tier doesn't support preDeployCommand, and a docker service can't use startCommand, so
    # run migrations + seed sources/default config at container start, then launch uvicorn on $PORT.
    # All steps are idempotent. dockerCommand overrides the Dockerfile CMD.
    dockerCommand: sh -c "alembic upgrade head && python -m worker.seeds && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oilnews-db
          property: connectionString
      - key: API_BEARER_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: "*" # tighten to your web origin once the frontend URL is known
      - key: ANTHROPIC_API_KEY
        sync: false # set in the dashboard to go live with real models (optional)
      - key: EIA_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_DEFAULT_CHAT_ID
        sync: false

  # --- Worker (continuous ingest → analyze → alert) -------------------------
  # Omitted for a fully-free deploy. The always-on worker needs a paid instance, so instead we
  # drive ingestion with a free external cron hitting POST /api/ingest/run every ~15 min
  # (see DEPLOY.md → "Triggering ingestion"). To run hands-off continuous operation later, add a
  # service of `type: worker`, `plan: starter`, `startCommand: python -m worker.scheduler`, with
  # the same DATABASE_URL/ANTHROPIC_API_KEY env vars and INGEST_INTERVAL_SEC=900.

  # --- Frontend (static export) ---------------------------------------------
  - type: web
    name: oilnews-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: out
    envVars:
      # Set to the API's URL after its first deploy (e.g. https://oilnews-api.onrender.com),
      # then trigger a redeploy so it bakes into the static build.
      - key: NEXT_PUBLIC_API_BASE
        sync: false
      # Same shared bearer token as the API (auth-lite; visible client-side by design).
      - key: NEXT_PUBLIC_API_TOKEN
        fromService:
          type: web
          name: oilnews-api
          envVarKey: API_BEARER_TOKEN
